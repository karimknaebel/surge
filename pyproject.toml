[project]
name = "surge"
version = "1.0.0"
description = "SurGe: Improved Surface Geometry in Point Maps"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karim Knaebel", email = "contact@knaebel.dev" }]
requires-python = ">=3.12"
dependencies = [
  "torch>=2.12",
  "torchvision",
  "numpy",
  "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@31d016566e9dbf9f499aa6a96b1f52f6dc63227b",
  "opencv-python-headless<5",
  "timm>=1.0.15",
  "einops>=0.8.1",
  "specbuild>=0.1.0,<0.2.0",
  "huggingface_hub",
]

[project.optional-dependencies]
cli = [
  "rerun-sdk",
  "trimesh",
  "matplotlib",
  "pyglet<2",
  "onnxruntime",
  "tqdm",
]
app = [
  "gradio",
  "matplotlib",
  "trimesh",
  "onnxruntime",
  "spaces",
]
eval = [
  "moge @ git+https://github.com/microsoft/MoGe.git@74fbce054ebed49800de42d0ad0e83495065719a",
  "tqdm",
]

[dependency-groups]
dev = ["pytest>=8.3.5"]

[project.scripts]
surge-infer = "surge.cli:main"
surge-app = "surge.app:main"
surge-eval = "surge.evaluation.cli:main"

[project.urls]
Homepage = "https://github.com/karimknaebel/surge"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-dependencies = [
  { package = { name = "moge" }, dependencies = ["flex-gemm", "torch", "torchvision"] },
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
